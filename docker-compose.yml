services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 5
    networks:
      - attendance-net

  ml-service:
    build:
      context: ./ml-service
    environment:
      MODEL_DIR: /app/weights
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5
      start_period: 60s
    networks:
      - attendance-net

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      ML_SERVICE_URL: ${ML_SERVICE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - attendance-net

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://10.232.2.237:4000
    ports:
      - "3000:3000"
      - "3443:3443"
    depends_on:
      backend:
        condition: service_started
    networks:
      - attendance-net

volumes:
  pgdata:

networks:
  attendance-net:
    driver: bridge
